name: laya-decision-lab
services:
  demo:
    build: .
    image: laya-decision-lab:local
    ports:
      - "127.0.0.1:${LAYA_PORT:-8765}:8765"
    volumes:
      - models:/models
    environment:
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/status', timeout=5)); assert s['state'] in ('ready', 'analyzing')"
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 40
volumes:
  models:
